name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 仅做打包校验，不真正发布
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 $tag 与 package.json 的 version $version 不一致，请先执行 npm version"
            exit 1
          fi
          echo "tag $tag == version $version"

      - name: Lint, typecheck, test and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
          else
            tag="latest"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "dist-tag: $tag"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs['dry-run'] || 'false' }}
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          args=(--access public --tag "${{ steps.dist-tag.outputs.value }}")
          [ "$VISIBILITY" = "public" ] && args+=(--provenance)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          echo "npm publish ${args[*]}"
          npm publish "${args[@]}"
